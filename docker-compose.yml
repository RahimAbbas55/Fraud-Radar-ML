services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fraud-radar-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: fraud-radar-cluster-01
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  producer:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m src.producer --limit 500 --delay 0.05
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092  # internal listener, not localhost
    volumes:
      - ./data:/app/data  # dataset needs to be visible inside the container
    depends_on:
      kafka:
        condition: service_healthy  # wait for Kafka to be genuinely ready, not just started

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m src.consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./data:/app/data      # for the SQLite database file and dataset
      - ./models:/app/models  # trained model needs to be visible inside the container
    depends_on:
      kafka:
        condition: service_healthy